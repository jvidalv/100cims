[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/api/Dockerfile"

[build.args]
# postgres.railway.internal only resolves at runtime; use public URL for build.
DATABASE_URL = "${{Postgres.DATABASE_PUBLIC_URL}}"

[deploy]
startCommand = "cd packages/api && npx drizzle-kit migrate && cd /app && node packages/api/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
